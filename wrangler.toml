name = "ilm-brief"
compatibility_date = "2026-10-10"
main = "src/worker.js"

# Static site in ./public, served through a small Worker that enforces the access window.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# ── Access window ─────────────────────────────────────────────
# Edit these two lines (here in GitHub) to change the dates; Cloudflare redeploys automatically.
# Format: YYYY-MM-DDTHH:MM:SS+08:00  (+08:00 = Malaysia time). Leave "" for no limit.
[vars]
OPEN_FROM = "2026-10-07T00:00:00+08:00"
CLOSE_AT  = "2026-10-18T15:00:00+08:00"
